<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>StockLine</title>
    <meta name="description" content="Tiny inventory app that predicts the day you'll run out of stock (the death line) and uses AI (Claude, OpenAI or Gemini) to prioritise orders, log movements in plain language and read delivery notes." />
    <meta name="theme-color" content="#6d4aff" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      // Apply the saved theme before the first paint (no light/dark flash).
      try {
        const prefs = JSON.parse(localStorage.getItem("stockline.prefs.v1") || "{}");
        if (prefs.theme === "light" || prefs.theme === "dark") document.documentElement.dataset.theme = prefs.theme;
      } catch {}
    </script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/dashboard">
          <img src="assets/favicon.svg" alt="" width="30" height="30" />
          <span id="brand-name">StockLine</span>
        </a>
        <nav class="tabs" id="tabs" aria-label="Main"></nav>
        <div class="topbar-actions">
          <button class="ai-badge" id="ai-badge" type="button" data-action="open-settings"></button>
          <select class="lang-select" id="lang-select" aria-label="Language"></select>
          <button class="icon-btn" id="theme-btn" type="button" data-action="toggle-theme" aria-label="Theme"></button>
          <button class="icon-btn" type="button" data-action="open-settings" aria-label="Settings">
            <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg>
          </button>
        </div>
      </div>
    </header>

    <main id="view" class="container"></main>
    <footer class="footer" id="footer"></footer>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <input type="file" id="photo-input" accept="image/*" hidden />
    <input type="file" id="import-input" accept="application/json,.json" hidden />

    <noscript>StockLine needs JavaScript.</noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
